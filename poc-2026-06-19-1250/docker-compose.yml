version: '3'
services:
  app:
    build: .
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    restart: always
  postgres:
    image: postgres:12
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:6
volumes:
  postgres-data: